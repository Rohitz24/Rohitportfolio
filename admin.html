<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Rohit Zade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <div class="nav-left">
                <button id="themeToggleBtn" class="theme-toggle" title="Switch Theme">🌙</button>
                <div class="logo"><span class="logo-accent">&gt;</span> Admin_Control_Suite</div>
            </div>
            <div class="nav-right">
                <a href="index.html" class="btn btn-secondary">&gt; View Public Site</a>
                <button id="logoutBtn" class="btn btn-danger" style="display: none;">[LOGOUT]</button>
            </div>
        </nav>
    </header>

    <div class="container admin-container">
        <!-- Toast Feedback -->
        <div id="adminToast" class="toast"></div>

        <!-- Login Form View -->
        <div id="loginView" class="admin-auth-card">
            <div class="card-top-bar">
                <span class="circle-dot red"></span>
                <span class="circle-dot yellow"></span>
                <span class="circle-dot green"></span>
                <span class="card-file-label">authenticate_session.sh</span>
            </div>
            <form id="loginForm" class="form-content">
                <div class="form-group">
                    <label for="username">&gt; USERNAME</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label for="password">&gt; PASSWORD</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">&gt; LOGIN TO DASHBOARD</button>
            </form>
        </div>

        <!-- Authenticated Dashboard View -->
        <div id="dashboardView" style="display: none;">
            
            <!-- Profile & Bio Editor -->
            <div class="admin-panel-card">
                <div class="card-top-bar">
                    <span class="circle-dot red"></span>
                    <span class="circle-dot yellow"></span>
                    <span class="circle-dot green"></span>
                    <span class="card-file-label">edit_core_information.json</span>
                </div>
                <form id="profileForm" class="form-content">
                    <div class="form-group">
                        <label for="statusInput">&gt; HERO STATUS BADGE</label>
                        <input type="text" id="statusInput" required>
                    </div>
                    <div class="form-group">
                        <label for="heroBioInput">&gt; HERO SUB-TEXT</label>
                        <input type="text" id="heroBioInput" required>
                    </div>
                    <div class="form-group">
                        <label for="bioInput">&gt; ABOUT ME PARAGRAPH</label>
                        <textarea id="bioInput" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="skillsInput">&gt; SKILLS (Comma Separated)</label>
                        <input type="text" id="skillsInput" required>
                    </div>
                    <button type="submit" class="btn btn-primary">&gt; SAVE CORE INFO</button>
                </form>
            </div>

            <!-- Experience Manager -->
            <div class="admin-panel-card">
                <div class="card-top-bar">
                    <span class="circle-dot red"></span>
                    <span class="circle-dot yellow"></span>
                    <span class="circle-dot green"></span>
                    <span class="card-file-label">manage_experience.json</span>
                </div>
                <div class="form-content">
                    <h3 id="expFormTitle" class="admin-subhead">&gt; Add Experience / Certification</h3>
                    <form id="experienceForm">
                        <input type="hidden" id="expId">
                        <div class="input-row">
                            <div class="form-group">
                                <label for="expRole">&gt; ROLE / PROGRAM TITLE</label>
                                <input type="text" id="expRole" required>
                            </div>
                            <div class="form-group">
                                <label for="expOrg">&gt; ORGANIZATION / PLATFORM</label>
                                <input type="text" id="expOrg" required>
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="form-group">
                                <label for="expPeriod">&gt; TIMEFRAME / YEAR</label>
                                <input type="text" id="expPeriod" placeholder="2026" required>
                            </div>
                            <div class="form-group">
                                <label for="expStack">&gt; TECH STACK / TOPICS</label>
                                <input type="text" id="expStack" placeholder="Java, Spring Boot, React" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="expDesc">&gt; DETAILS / SUMMARY</label>
                            <textarea id="expDesc" rows="3" required></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="saveExpBtn" class="btn btn-primary">&gt; SAVE EXPERIENCE</button>
                            <button type="button" id="cancelExpBtn" class="btn btn-secondary" style="display: none;">CANCEL</button>
                        </div>
                    </form>

                    <h4 class="admin-subhead" style="margin-top: 30px;">&gt; Current Experience Records</h4>
                    <div id="adminExpList" class="admin-item-list"></div>
                </div>
            </div>

            <!-- Projects Manager -->
            <div class="admin-panel-card">
                <div class="card-top-bar">
                    <span class="circle-dot red"></span>
                    <span class="circle-dot yellow"></span>
                    <span class="circle-dot green"></span>
                    <span class="card-file-label">manage_projects_database.json</span>
                </div>
                <div class="form-content">
                    <h3 id="projectFormTitle" class="admin-subhead">&gt; Add New Project</h3>
                    <form id="projectForm">
                        <input type="hidden" id="projectId">
                        <div class="input-row">
                            <div class="form-group">
                                <label for="projTitle">&gt; PROJECT TITLE</label>
                                <input type="text" id="projTitle" required>
                            </div>
                            <div class="form-group">
                                <label for="projTag">&gt; APP TAG / EXECUTABLE</label>
                                <input type="text" id="projTag" placeholder="app_v1.0" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="projImg">&gt; IMAGE URL OR FILE PATH</label>
                            <input type="text" id="projImg" placeholder="calc.png" required>
                        </div>
                        <div class="form-group">
                            <label for="projDesc">&gt; SHORT OVERVIEW</label>
                            <textarea id="projDesc" rows="2" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="projDetails">&gt; MODAL DETAILED WRITE-UP</label>
                            <textarea id="projDetails" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="projGithub">&gt; GITHUB REPOSITORY LINK</label>
                            <input type="url" id="projGithub" required>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="saveProjBtn" class="btn btn-primary">&gt; SAVE PROJECT</button>
                            <button type="button" id="cancelEditBtn" class="btn btn-secondary" style="display: none;">CANCEL</button>
                        </div>
                    </form>

                    <h4 class="admin-subhead" style="margin-top: 30px;">&gt; Existing Project Catalogue</h4>
                    <div id="adminProjectsList" class="admin-item-list"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
